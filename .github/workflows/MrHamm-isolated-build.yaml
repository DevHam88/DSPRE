name: MrHam's DSPRE Isolated Build

on:
  push:
    branches:
      - ci/mrham-build

permissions:
  contents: write

concurrency:
  group: mrham-isolated-build
  cancel-in-progress: true

env:
  SOLUTION_FILE_PATH: DS_Map.sln
  BUILD_CONFIGURATION: Release
  RELEASE_TAG: canary-alpha-test

jobs:
  build:
    if: github.repository == 'DevHam88/DSPRE'
    runs-on: windows-latest

    steps:
      - name: Check out build controller
        uses: actions/checkout@v4

      - name: Read build target
        id: target
        shell: pwsh
        run: |
          $target = (Get-Content ".github/build-target.txt" -Raw).Trim()
          if ($target -notmatch '^[0-9a-fA-F]{40}$') {
            throw ".github/build-target.txt must contain one full 40-character commit SHA."
          }
          "sha=$target" >> $env:GITHUB_OUTPUT

      - name: Check out target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Verify target commit
        id: source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "${{ steps.target.outputs.sha }}") {
            throw "Checked out $actual instead of ${{ steps.target.outputs.sha }}."
          }
          "sha=$actual" >> $env:GITHUB_OUTPUT
          "short_sha=$($actual.Substring(0, 8))" >> $env:GITHUB_OUTPUT

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone database repository
        run: git clone https://github.com/DS-Pokemon-Rom-Editor/scrcmd-database.git databases

      - name: Clone ds-rom repository
        run: git clone --depth 1 https://github.com/DS-Pokemon-Rom-Editor/ds-rom.git ds-rom

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

      - name: Build DSPRE
        run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}

      - name: Build dsrom.exe
        shell: pwsh
        run: |
          cargo build --release -p ds-rom-cli --manifest-path ds-rom/Cargo.toml
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\DS_Map\bin\Release\Tools" | Out-Null
          Copy-Item -Path "${{ github.workspace }}\ds-rom\target\release\dsrom.exe" -Destination "${{ github.workspace }}\DS_Map\bin\Release\Tools\dsrom.exe" -Force

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\DS_Map\bin\Release\databases" | Out-Null
          robocopy databases "${{ github.workspace }}\DS_Map\bin\Release\databases" /E /XD "databases\.git\objects\pack"
          if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }

      - name: Create package
        shell: pwsh
        run: Compress-Archive -Path "${{ github.workspace }}\DS_Map\bin\Release\*" -DestinationPath "DSPRE-MrHam-alpha-test-${{ steps.source.outputs.sha }}.zip"

      - name: Replace alpha release and tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ env.RELEASE_TAG }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete "${{ env.RELEASE_TAG }}" --yes
          }
          git fetch --prune --tags origin
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ env.RELEASE_TAG }}" -m "MrHam isolated build for ${{ steps.source.outputs.sha }}"
          git push -f origin "refs/tags/${{ env.RELEASE_TAG }}"

      - name: Get current date
        id: date
        shell: pwsh
        run: |
          "date=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_OUTPUT

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MrHam's DSPRE Alpha Test Build ${{ steps.date.outputs.date }} (${{ steps.source.outputs.short_sha }})
          files: DSPRE-MrHam-alpha-test-${{ steps.source.outputs.sha }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            This fork-only test package was built from commit `${{ steps.source.outputs.sha }}`.

            The commit is selected by `.github/build-target.txt` on the `ci/mrham-build` branch.
          prerelease: true
          generate_release_notes: false
          make_latest: false
